schemaVersion: 1
model:
  backend: pytorch
  variant: artrackv2_b_256
  weights: ../models/artrackv2_b_256.pth.tar
  precision: fp32
scoring:
  calibrationArtifact: null
  requireCheckpointHashMatch: true
geometry:
  viewWidthPx: 256
  viewHeightPx: 256
  boundarySamplesPerEdge: 65
  minFovDeg: 20.0
  maxFovDeg: 120.0
  resampler: cpu
motion:
  minSamplesForVelocity: 2
  maxTangentSpanRad: 1.20
  huberDeltaRad: 0.15
  processNoiseRadPerSec: 0.04
  maxAngularSpeedRadPerSec: 2.0
  maxLogScaleRatePerSec: 1.0
tracking:
  candidateMinScore: 0.597262
  stableFramesBeforeUpdate: 8
  windowLength: 5
  contextScale: 2.0
  contextMarginRatio: 0.15
  maxPredictionHorizon: 3
backendTuning:
  acceptAnyCandidate: true
  viewHorizontalFovCapDeg: 90.0
  viewVerticalFovCapDeg: 90.0
  fullViewSearch: false
  useMotionScore: false
  templateFovScale: 2.5
  onlineTemplate: true
  templateMinConfidence: 0.515
  holdWeakBox: true
reproducibility:
  seed: 0
  deterministic: true
visualization:
  enabled: false
  outputRoot: ../outputs/visualization
  stages:
    - local_rgb
    - backend_box
    - geometry_box
