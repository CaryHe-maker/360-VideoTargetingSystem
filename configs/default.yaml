schemaVersion: 1
model:
  backend: pytorch
  variant: artrackv2_b_256
  weights: ../models/artrackv2_b_256.pth.tar
  precision: fp32
scoring:
  calibrationArtifact: null
  requireCheckpointHashMatch: true
geometry:
  viewWidthPx: 256
  viewHeightPx: 256
  boundarySamplesPerEdge: 65
  minFovDeg: 20.0
  maxFovDeg: 120.0
decisionGate:
  motionScoreWeight: 0.25
  scaleScoreWeight: 0.15
evaluator:
  supportWeight: 0.25
  agreementWeight: 0.25
  minReacquireViews: 2
  successRate: 0.90
  firstRoundFusionOverlap: 0.30
  overlapThreshold: 0.70
  fusionSourceMinConfidence: 0.740642
  fusionBoxMode: best_source
motion:
  minSamplesForVelocity: 2
  maxTangentSpanRad: 1.20
  huberDeltaRad: 0.15
  processNoiseRadPerSec: 0.04
  maxAngularSpeedRadPerSec: 2.0
  maxLogScaleRatePerSec: 1.0
tracking:
  candidateMinScore: 0.597262
  stableFramesBeforeUpdate: 8
  windowLength: 5
  contextScale: 2.0
  contextMarginRatio: 0.15
  scaleClusterTolerance: 0.50
  maxPredictionHorizon: 3
  guardYawStepDeg: 120.0
  minViewsForCommit: 2
  sameFrameEscalationEnabled: true
  maxAttemptsPerFrame: 2
  maxViewsPerFrameTotal: 12
  uncertainFovScale: 1.25
  reacquireCooldownFrames: 2
recovery:
  maxViewsPerFrame: 12
  globalSearchInterval: 5
  ringRadii: [1.0, 1.75, 2.5]
  viewsPerRing: [4, 8, 12]
  cubeMapOverlapRatio: 0.10
  maxCoveredCells: 256
runtime:
  decodeQueueCapacity: 3
  inferRequestQueueCapacity: 1
  inferResponseQueueCapacity: 1
  resultQueueCapacity: 32
visualization:
  enabled: false
  outputRoot: ../outputs/visualization
  stages:
    - local_rgb
    - backend_box
    - geometry_box
