[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "track360"
version = "2.0.0.dev0"
description = "Spherical multi-view single-object tracking for 360-degree (equirectangular) video"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.11,<5",
  "PyYAML>=6,<7",
  "torch>=2.11,<2.12",
  "torchvision>=0.26,<0.27",
  "timm==0.5.4",
  "easydict>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.urls]
Repository = "https://github.com/CaryHe-maker/360-VideoTargetingSystem"

[project.scripts]
track360 = "track360.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"track360.third_party.artrackv2" = ["*.yaml", "LICENSE", "lib/**/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/track360/third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
